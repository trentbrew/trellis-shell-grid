[package]
name = "react-grid"
version = "0.1.0"
description = "Hyper-flexible WM-style information design surface"
authors = ["Trent Brew <tbrew@turtle.tech>"]
edition = "2021"

[lib]
name = "react_grid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
dirs = "5.0"
tokio = { version = "1", features = ["full"] }
